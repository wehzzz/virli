[package]
name = "mymoulette"
version = "0.1.0"
edition = "2024"

[dependencies]
caps = "0.5.6"
nix = { version = "0.30.1", features = ["sched", "fs", "process", "mount"] }
libseccomp = "0.4.0"
libc = "0.2.178"
reqwest = { version = "0.12.28", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
tar = "0.4"
